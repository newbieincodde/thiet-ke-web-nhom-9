<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Practice</title>

    <style>
        /* Căn giữa toàn bộ màn hình */
        .container {
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background-color: #f2f2f2;
        }

        /* Hộp nội dung */
        .box {
            padding: 40px;
            background-color: white;
            border-radius: 10px;

            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="box">
            <h1>Flexbox</h1>
            <p>This box is centered.</p>
        </div>
    </div>

</body>
</html>
