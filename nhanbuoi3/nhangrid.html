<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Battle</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 40px;
            background-color: #f9f9f9;
        }

        /* Bố cục Grid 3 cột */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 cột bằng nhau */
            gap: 20px;                             /* Khoảng cách giữa các cột/hàng */
        }

        /* Các thẻ cột */
        .grid-item {
            background-color: #e2e8f0; /* Màu nền xám nhạt */
            padding: 25px;
            border-radius: 10px;       /* Bo góc 10px */
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="grid-container">
        <div class="grid-item">
            <h3>Cột 1</h3>
            <p>Nội dung thẻ thứ nhất.</p>
        </div>
        <div class="grid-item">
            <h3>Cột 2</h3>
            <p>Nội dung thẻ thứ hai.</p>
        </div>
        <div class="grid-item">
            <h3>Cột 3</h3>
            <p>Nội dung thẻ thứ ba.</p>
        </div>
    </div>

</body>
</html>
