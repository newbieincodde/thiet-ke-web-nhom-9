<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox & CSS Grid Demo</title>
  <link rel="stylesheet" href="baitap1.css">
</head>
<body>

  <!-- Thẻ container được căn giữa toàn màn hình bằng Flexbox -->
  <div class="container">
    
    <!-- Lưới 3 cột được chia bằng CSS Grid -->
    <div class="grid-container">
      <div class="grid-item">
        <h3>Cột 1</h3>
        <p>Thông tin trường</p>
      </div>
      <div class="grid-item">
        <h3>Cột 2</h3>
        <p>Thông tin lớp</p>
      </div>
      <div class="grid-item">
        <h3>Cột 3</h3>
        <p>Thông tin học sinh</p>
      </div>
    </div>

  </div>

</body>
</html>
